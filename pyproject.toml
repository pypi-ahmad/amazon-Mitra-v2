[project]
name = "glass-box"
version = "0.1.0"
description = "Interactive tutorial for Amazon AutoGluon Mitra-v2"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.57,<2",
  "autogluon.tabular[mitra]>=1.6,<1.7",
  "datasets>=4.0,<5",
  "huggingface_hub>=1.0,<2",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "pyarrow>=18",
  "plotly>=6,<7",
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<1",
  "scikit-learn>=1.6,<2",
  "tabarena>=0.1",
]

[dependency-groups]
dev = ["ruff>=0.13", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]
